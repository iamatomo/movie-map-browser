<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Movie Map Browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Space Mono', monospace;
    background: #0f1115;
    color: #e8e8ec;
  }
  #topbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    padding: 12px 16px;
  }
  button {
    background: #1c1f26;
    color: #e8e8ec;
    border: 1px solid #2c303a;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 14px;
    font-family: 'Space Mono', monospace;
    cursor: pointer;
  }
  button.active { border-color: #6ea8fe; color: #6ea8fe; }
  #app-title {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.01em;
    margin: 0;
  }
  #stage {
    position: relative;
    width: 100%;
    height: calc(100vh - 130px);
    background: #14161c;
    touch-action: none;
    cursor: grab;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  #hint {
    font-size: 12px;
    color: #8a8f99;
    padding: 0 16px;
  }
  #status { padding: 16px; color: #8a8f99; font-size: 14px; }
  #zoom-controls {
    position: absolute;
    right: 16px;
    bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 10;
  }
  #zoom-controls button {
    width: 40px;
    height: 40px;
    padding: 0;
    font-size: 20px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cluster-circle { fill: #2a6f6a; transition: opacity 80ms linear; }
  .orbit-line { stroke: #2a6f6a; stroke-width: 1; transition: opacity 80ms linear; }
  .movie-dot { fill: #e07856; transition: opacity 80ms linear; }
  text { fill: #e8e8ec; font-size: 11px; font-family: 'Space Mono', monospace; text-anchor: middle; transition: opacity 80ms linear; }

  /* Modal: title carries the most visual weight, field labels are small,
     wide-tracked, and uppercase to sit clearly above their values, and
     values are set larger and looser so the hierarchy reads at a glance. */
  #modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  #modal-card {
    position: relative;
    background: #1c1f26;
    border: 1px solid #2c303a;
    border-radius: 14px;
    padding: 28px 28px 24px;
    max-width: 440px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    font-family: 'Space Mono', monospace;
  }
  #modal-card h2 {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 20px;
    line-height: 1.3;
    margin: 0 24px 20px 0;
  }
  #modal-close {
    position: absolute;
    top: 18px;
    right: 18px;
    background: none;
    border: none;
    color: #8a8f99;
    font-size: 18px;
    font-family: 'Space Mono', monospace;
    cursor: pointer;
    padding: 0;
  }
  .field { margin-bottom: 16px; }
  .field-label {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #8a8f99;
    margin-bottom: 5px;
  }
  .field-value {
    font-family: 'Space Mono', monospace;
    font-weight: 400;
    font-size: 14px;
    line-height: 1.6;
  }

  /* Draft takeover */
  #draft-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 60;
    padding: 20px;
  }
  #draft-card {
    position: relative;
    background: #1c1f26;
    border: 1px solid #2c303a;
    border-radius: 16px;
    padding: 32px 32px 28px;
    max-width: 780px;
    width: 100%;
    max-height: 88vh;
    overflow-y: auto;
    font-family: 'Space Mono', monospace;
  }
  #draft-close {
    position: absolute;
    top: 20px;
    right: 20px;
    background: none;
    border: none;
    color: #8a8f99;
    font-size: 20px;
    font-family: 'Space Mono', monospace;
    cursor: pointer;
    padding: 0;
  }
  #draft-sentence {
    font-size: 19px;
    line-height: 1.6;
    margin: 0 40px 22px 0;
  }
  #draft-sentence .filled { color: #e07856; font-weight: 700; }
  #draft-sentence .empty { color: #565b66; }
  #draft-sentence .blank {
    cursor: pointer;
    border-bottom: 1px dashed #565b66;
    padding-bottom: 1px;
  }
  #draft-sentence .blank.active { border-bottom-color: #e07856; }
  .picker-panel {
    background: #14161c;
    border: 1px solid #2c303a;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 22px;
  }
  .picker-label {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #8a8f99;
    margin-bottom: 10px;
  }
  .genre-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .genre-chip {
    background: #1c1f26;
    border: 1px solid #2c303a;
    color: #e8e8ec;
  }
  .genre-chip.selected {
    border-color: #e07856;
    color: #e07856;
    background: rgba(224,120,86,0.1);
  }
  .draft-hint {
    font-size: 12px;
    color: #8a8f99;
    margin: -14px 0 22px;
  }
  .draft-tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  .draft-tile {
    background: #14161c;
    border: 1px solid #2c303a;
    border-radius: 12px;
    padding: 16px 16px 18px;
    cursor: pointer;
  }
  .draft-tile.selected { border-color: #e07856; box-shadow: 0 0 0 1px #e07856; }
  .draft-tile h3 {
    font-family: 'Space Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 10px;
    line-height: 1.3;
  }
  .draft-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  #watch-btn {
    border-color: #e07856;
    color: #e07856;
  }
  #watch-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  #redraft-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .draft-loader {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 48px 0;
    margin-bottom: 24px;
    color: #8a8f99;
    font-size: 13px;
  }
  .draft-loader-dots { display: flex; gap: 8px; }
  .draft-loader-dots span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #e07856;
    animation: draft-pulse 1s infinite ease-in-out;
  }
  .draft-loader-dots span:nth-child(2) { animation-delay: 0.15s; }
  .draft-loader-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes draft-pulse {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>
  <div id="topbar">
    <h1 id="app-title">My Movie Universe</h1>
    <div style="margin-left:auto;display:flex;gap:8px;">
      <button id="draft-btn">Draft tonight's movies</button>
      <button id="reset-btn">Reset view</button>
    </div>
  </div>
  <p id="hint">scroll or pinch to zoom &middot; drag to pan &middot; zoom into a cluster to see individual titles</p>
  <div id="stage">
    <svg id="world" width="100%" height="100%" viewBox="0 0 680 420"><defs id="defs"></defs><g id="g"></g></svg>
    <div id="zoom-controls">
      <button id="zoom-in-btn" aria-label="Zoom in">+</button>
      <button id="zoom-out-btn" aria-label="Zoom out">&minus;</button>
    </div>
  </div>
  <div id="status">Loading your collection…</div>
  <div id="detail"></div>
  <div id="draft-root"></div>

<script>
// If your title field in Airtable is called something other than one of
// these, add it to the front of this list.
const TITLE_FIELD_CANDIDATES = ["Name", "Title", "Movie", "Movie Title"];
const GENRE_FIELD_CANDIDATES = ["Genre"];
// "Description" is the field name that was asked for, but a lot of bases
// use something else for long-form text, so a few common alternatives
// are checked too.
const DESCRIPTION_FIELD_CANDIDATES = ["Description", "Synopsis", "Summary", "Notes"];
const RUNTIME_FIELD_CANDIDATES = ["Runtime (Official Theatrical, Minutes)", "Runtime", "Run Time"];
// Handles either shape Airtable might hand back: a plain URL string field,
// a real Attachment field (an array of attachment objects), or an
// AI-generated image field, which can wrap the value in { value, state }
// the same way the Description AI field does.
const COVER_ART_FIELD_CANDIDATES = ["Cover Art (Web Image)", "Cover Art", "Cover", "Poster"];

function getCoverArtUrl(m) {
  for (const f of COVER_ART_FIELD_CANDIDATES) {
    let v = m[f];
    if (!v) continue;
    if (!Array.isArray(v) && typeof v === "object" && v.value !== undefined) v = v.value;
    if (!v) continue;
    if (typeof v === "string") return v;
    if (Array.isArray(v) && v.length > 0) {
      const att = v[0];
      if (typeof att === "string") return att;
      const url = (att.thumbnails && (att.thumbnails.large || att.thumbnails.full))
        ? (att.thumbnails.large || att.thumbnails.full).url
        : att.url;
      if (url) return url;
    }
    if (typeof v === "object" && typeof v.url === "string") return v.url;
  }
  return null;
}

function getField(m, candidates) {
  for (const f of candidates) {
    const v = m[f];
    if (v === undefined || v === null || v === "") continue;
    // Airtable AI fields return an object like { value, state } instead
    // of a plain string, so unwrap that shape if present.
    if (typeof v === "object") {
      if (typeof v.value === "string" && v.value) return v.value;
      continue;
    }
    return v;
  }
  return null;
}

// Fields to ignore when building clustering options (not useful as
// categories to browse by).
const IGNORE_FIELDS = new Set(["id", ...TITLE_FIELD_CANDIDATES, ...COVER_ART_FIELD_CANDIDATES, ...RUNTIME_FIELD_CANDIDATES]);

let movies = [];
let categoryFields = [];
let curCat = null;
const MIN_SCALE = 0.5, MAX_SCALE = 4;
let tx = 0, ty = 0, scale = MIN_SCALE; // start fully zoomed out
let currentT = 0;
let clusterMeta = {};
let contentMinX = 0, contentMaxX = 680, contentMinY = 0, contentMaxY = 420;
let interactionBoost = 0; // rises on pan/zoom, decays back toward 0 when idle
let ready = false;
function getTitle(m) {
  for (const f of TITLE_FIELD_CANDIDATES) if (m[f]) return m[f];
  return "untitled";
}

function detectCategoryFields(list) {
  // A field is a good clustering candidate if it's a plain string
  // (single-select/text) present on most records, not wildly unique
  // (that would just be the title again) and not a number.
  const counts = {};
  list.forEach((m) => {
    Object.entries(m).forEach(([k, v]) => {
      if (IGNORE_FIELDS.has(k)) return;
      if (typeof v !== "string") return;
      counts[k] = counts[k] || new Set();
      counts[k].add(v);
    });
  });
  return Object.keys(counts).filter((k) => counts[k].size < list.length * 0.8);
}

function keyFor(m, field) {
  return m[field] || "unspecified";
}

function layout() {
  clusterMeta = {};
  contentMinX = Infinity; contentMaxX = -Infinity;
  contentMinY = Infinity; contentMaxY = -Infinity;
  const groups = {};
  movies.forEach((m) => {
    const k = keyFor(m, curCat);
    (groups[k] = groups[k] || []).push(m);
  });
  const keys = Object.keys(groups);
  const cols = Math.ceil(Math.sqrt(keys.length));
  const spacing = 320;
  keys.forEach((k, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    const cx = 180 + col * spacing, cy = 150 + row * spacing;
    const items = groups[k];
    items.forEach((m) => {
      const title = getTitle(m);
      m._r = 22 + Math.min(title.length, 18) * 2.1;
      m.x = cx + (Math.random() - 0.5) * 10;
      m.y = cy + (Math.random() - 0.5) * 10;
      m._cx = cx; m._cy = cy; m._key = k; m._n = items.length;
      // Each title gets its own small, slow, unique wobble so the
      // collection doesn't all breathe in lockstep.
      m._phaseX = Math.random() * Math.PI * 2;
      m._phaseY = Math.random() * Math.PI * 2;
      m._speed = 0.25 + Math.random() * 0.25;
    });
    // The cluster circle itself also gets a slow drift, distinct from
    // its titles', so the "planet" reads as its own body in motion.
    clusterMeta[k] = {
      cx, cy, n: items.length,
      phaseX: Math.random() * Math.PI * 2,
      phaseY: Math.random() * Math.PI * 2,
      speed: 0.18 + Math.random() * 0.12,
    };
    const r = 22 + items.length * 2.5;
    contentMinX = Math.min(contentMinX, cx - r);
    contentMaxX = Math.max(contentMaxX, cx + r);
    contentMinY = Math.min(contentMinY, cy - r);
    contentMaxY = Math.max(contentMaxY, cy + r);
  });

  // One simulation across every movie, not one per cluster. Collision
  // is checked globally so a crowded cluster pushes its neighbors away
  // instead of just overlapping them, while the gentle x/y pull keeps
  // each item drifting back toward its own cluster's center.
  const sim = d3.forceSimulation(movies)
    .force("collide", d3.forceCollide((d) => d._r).strength(0.9).iterations(2))
    .force("x", d3.forceX((d) => d._cx).strength(0.08))
    .force("y", d3.forceY((d) => d._cy).strength(0.08))
    .stop();
  for (let t = 0; t < 300; t++) sim.tick();
  movies.forEach((m) => { m._x = m.x; m._y = m.y; });
}

// Instead of a single cutoff, titles emerge gradually across a zoom
// range so the transition feels like it's happening, not flipping.
const DECLUSTER_START = 1.3;
const DECLUSTER_END = 1.9;

const SVG_NS = "http://www.w3.org/2000/svg";

// Builds the actual SVG elements once and keeps references to them, so
// each animation frame only updates attributes (cheap) instead of
// rebuilding the whole scene as a string (expensive at 60fps).
function buildDom() {
  const g = document.getElementById("g");
  const defs = document.getElementById("defs");
  g.innerHTML = "";
  defs.innerHTML = "";
  // Spoke lines go in first, so they sit visually behind the cluster
  // circles and title dots, connecting each title back to its genre's
  // center even as everything drifts independently.
  movies.forEach((m) => {
    const line = document.createElementNS(SVG_NS, "line");
    line.setAttribute("class", "orbit-line");
    g.appendChild(line);
    m._lineEl = line;
  });
  Object.entries(clusterMeta).forEach(([key, c]) => {
    const circle = document.createElementNS(SVG_NS, "circle");
    circle.setAttribute("class", "cluster-circle");
    circle.style.cursor = "pointer";
    circle.addEventListener("click", (e) => clusterCircleClicked(e, key));
    const text = document.createElementNS(SVG_NS, "text");
    text.textContent = `${key} (${c.n})`;
    g.appendChild(circle);
    g.appendChild(text);
    c.circleEl = circle; c.textEl = text;
  });
  movies.forEach((m) => {
    const dot = document.createElementNS(SVG_NS, "circle");
    dot.setAttribute("class", "movie-dot");
    dot.style.cursor = "pointer";

    // If cover art exists, fill the dot with it via a pattern instead of
    // the flat color. objectBoundingBox units mean the image auto-scales
    // to whatever radius the circle currently has, no per-frame syncing
    // needed. No art yet, no change, it stays the default planet shape.
    const coverUrl = getCoverArtUrl(m);
    if (coverUrl) {
      const patternId = `cover-${m.id}`;
      const pattern = document.createElementNS(SVG_NS, "pattern");
      pattern.setAttribute("id", patternId);
      pattern.setAttribute("patternUnits", "objectBoundingBox");
      pattern.setAttribute("patternContentUnits", "objectBoundingBox");
      pattern.setAttribute("width", "1");
      pattern.setAttribute("height", "1");
      const image = document.createElementNS(SVG_NS, "image");
      image.setAttributeNS("http://www.w3.org/1999/xlink", "href", coverUrl);
      image.setAttribute("href", coverUrl);
      image.setAttribute("x", "0");
      image.setAttribute("y", "0");
      image.setAttribute("width", "1");
      image.setAttribute("height", "1");
      image.setAttribute("preserveAspectRatio", "xMidYMid slice");
      pattern.appendChild(image);
      defs.appendChild(pattern);
      // Using style (not setAttribute) here matters: the .movie-dot CSS
      // class also sets fill, and a class rule beats a plain attribute
      // in SVG, so setAttribute alone would get silently overridden.
      dot.style.fill = `url(#${patternId})`;
      dot.setAttribute("stroke", "#0f1115");
      dot.setAttribute("stroke-width", "1");
    }

    dot.addEventListener("click", (e) => { e.stopPropagation(); showDetail(m.id); });
    const text = document.createElementNS(SVG_NS, "text");
    text.textContent = getTitle(m);
    g.appendChild(dot);
    g.appendChild(text);
    m._dotEl = dot; m._textEl = text;
  });
}

// A small, slow, per-body sine wander. `boost` amplifies it temporarily
// during and just after active panning/zooming, then settles back to
// a gentle idle amplitude, which is what gives the "moves while
// interacting, resolves to steadier when you stop" feel.
function computeDrift(phaseX, phaseY, speed, amplitude, timeSec, boost) {
  const amp = amplitude * (1 + boost * 2.5);
  return [
    Math.sin(timeSec * speed + phaseX) * amp,
    Math.cos(timeSec * speed * 0.85 + phaseY) * amp,
  ];
}

function render(now) {
  if (!ready) return;
  now = now || performance.now();
  const timeSec = now / 1000;

  // Keep at least a bit of the content on screen at all times: clamp
  // tx/ty so the content's bounding box can't be panned entirely out of
  // the viewport. Runs every frame, so it self-corrects regardless of
  // whether the pan came from a drag, a pinch, or the zoom buttons.
  const OVERLAP = 150; // viewBox units of content guaranteed visible
  const minTx = OVERLAP - contentMaxX * scale;
  const maxTx = (680 - OVERLAP) - contentMinX * scale;
  tx = minTx <= maxTx ? Math.min(maxTx, Math.max(minTx, tx)) : (minTx + maxTx) / 2;
  const minTy = OVERLAP - contentMaxY * scale;
  const maxTy = (420 - OVERLAP) - contentMinY * scale;
  ty = minTy <= maxTy ? Math.min(maxTy, Math.max(minTy, ty)) : (minTy + maxTy) / 2;

  const g = document.getElementById("g");
  g.setAttribute("transform", `translate(${tx},${ty}) scale(${scale})`);
  // t = 0 fully clustered, t = 1 fully declustered into individual titles
  const t = Math.max(0, Math.min(1,
    (scale - DECLUSTER_START) / (DECLUSTER_END - DECLUSTER_START)));
  currentT = t;

  // Cluster circles: always visible (background layer, dims to 75%
  // opacity once declustered rather than disappearing) and drifting
  // gently on their own, independent of their titles.
  Object.values(clusterMeta).forEach((c) => {
    const [dx, dy] = computeDrift(c.phaseX, c.phaseY, c.speed, 3, timeSec, interactionBoost);
    const cx = c.cx + dx, cy = c.cy + dy;
    c._renderCx = cx; c._renderCy = cy;
    const r = 22 + c.n * 2.5;
    const circleOpacity = 1 - t * 0.25;
    const labelOpacity = 1 - t * 0.5; // floors at 50%, never fully disappears
    c.circleEl.setAttribute("cx", cx);
    c.circleEl.setAttribute("cy", cy);
    c.circleEl.setAttribute("r", r);
    c.circleEl.style.opacity = circleOpacity;
    c.textEl.setAttribute("x", cx);
    c.textEl.setAttribute("y", cy + 4);
    c.textEl.style.opacity = labelOpacity;
  });

  // Individual titles emerge from their cluster's center and travel
  // outward to their settled (force-simulated) position as t increases.
  // While still clustered they drift together with their parent circle;
  // as they emerge they blend into their own independent small wander,
  // kept intentionally smaller than a title's own radius so this rarely
  // introduces new overlap on top of the settled layout.
  movies.forEach((m) => {
    const c = clusterMeta[m._key];
    const ownAmplitude = Math.min(3, m._r * 0.18);
    const [ownDx, ownDy] = computeDrift(m._phaseX, m._phaseY, m._speed, ownAmplitude, timeSec, interactionBoost);
    const driftX = (c._renderCx - c.cx) * (1 - t) + ownDx * t;
    const driftY = (c._renderCy - c.cy) * (1 - t) + ownDy * t;
    const ex = m._cx + t * (m._x - m._cx) + driftX;
    const ey = m._cy + t * (m._y - m._cy) + driftY;
    m._renderX = ex; m._renderY = ey; // used for nearest-title click lookup
    m._lineEl.setAttribute("x1", c._renderCx);
    m._lineEl.setAttribute("y1", c._renderCy);
    m._lineEl.setAttribute("x2", ex);
    m._lineEl.setAttribute("y2", ey);
    m._lineEl.style.opacity = t * 0.45; // stays subtle, never competes with the dot or label
    const r = 4 + 10 * t;
    const titleOpacity = Math.max(0, (t - 0.5) * 2);
    m._dotEl.setAttribute("cx", ex);
    m._dotEl.setAttribute("cy", ey);
    m._dotEl.setAttribute("r", r);
    m._dotEl.style.opacity = t;
    m._textEl.setAttribute("x", ex);
    m._textEl.setAttribute("y", ey + 22);
    m._textEl.style.opacity = titleOpacity > 0.03 ? titleOpacity : 0;
  });
}

// Runs continuously so the idle drift keeps animating even when nothing
// is being dragged or scrolled, and so interactionBoost has something
// decaying it back down every frame after an interaction ends.
let lastFrameTime = null;
function frameLoop(now) {
  if (lastFrameTime !== null) {
    const dt = now - lastFrameTime;
    interactionBoost *= Math.exp(-dt / 220);
    if (interactionBoost < 0.001) interactionBoost = 0;
  }
  lastFrameTime = now;
  render(now);
  requestAnimationFrame(frameLoop);
}
requestAnimationFrame(frameLoop);

function showDetail(id) {
  const m = movies.find((x) => x.id === id);
  if (!m) return;
  const rows = [];
  // Genre first, since it's the organizing field, then Runtime (a quick
  // scannable fact), then every other detected column with a value,
  // then Description last.
  if (m[curCat]) rows.push([curCat, m[curCat]]);
  const runtime = getField(m, RUNTIME_FIELD_CANDIDATES);
  if (runtime) {
    const clean = String(runtime).trim();
    rows.push(["Runtime", /^\d+$/.test(clean) ? `${clean} min` : clean]);
  }
  categoryFields.forEach((field) => {
    if (field === curCat) return;
    const v = m[field];
    if (typeof v === "string" && v) rows.push([field, v]);
  });
  const description = getField(m, DESCRIPTION_FIELD_CANDIDATES);
  if (description) rows.push(["Description", description]);

  document.getElementById("detail").innerHTML = `
    <div id="modal-overlay" onclick="if(event.target.id==='modal-overlay') closeModal()">
      <div id="modal-card">
        <button id="modal-close" onclick="closeModal()">&times;</button>
        <h2>${getTitle(m)}</h2>
        ${rows.map(([label, value]) => `
          <div class="field">
            <div class="field-label">${label}</div>
            <div class="field-value">${value}</div>
          </div>`).join("")}
      </div>
    </div>`;
}

function closeModal() {
  document.getElementById("detail").innerHTML = "";
}

// Lets clicking anywhere on a cluster's background circle open the
// nearest title's modal, not just a precise click on its small dot.
// Only resolves once titles are actually visible enough to mean
// something (fully clustered clicks do nothing, since there's no
// single title to point to yet).
function clusterCircleClicked(e, key) {
  if (currentT < 0.3) return;
  const p = toSvgPoint(e.clientX, e.clientY);
  const worldX = (p.x - tx) / scale;
  const worldY = (p.y - ty) / scale;
  let best = null, bestDist = Infinity;
  movies.forEach((m) => {
    if (m._key !== key || m._renderX === undefined) return;
    const dx = m._renderX - worldX, dy = m._renderY - worldY;
    const d = dx * dx + dy * dy;
    if (d < bestDist) { bestDist = d; best = m; }
  });
  if (best) showDetail(best.id);
}

// --- pan / zoom wiring ---
const stage = document.getElementById("stage");
const svgEl = document.getElementById("world");

function toSvgPoint(clientX, clientY) {
  const pt = svgEl.createSVGPoint();
  pt.x = clientX; pt.y = clientY;
  return pt.matrixTransform(svgEl.getScreenCTM().inverse());
}

let dragging = false, lastX = 0, lastY = 0;
stage.addEventListener("mousedown", (e) => { e.preventDefault(); dragging = true; lastX = e.clientX; lastY = e.clientY; stage.style.cursor = "grabbing"; });
window.addEventListener("mouseup", () => { dragging = false; stage.style.cursor = "grab"; });
window.addEventListener("mousemove", (e) => {
  if (!dragging) return;
  tx += e.clientX - lastX; ty += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  interactionBoost = 1;
  render();
});
stage.addEventListener("wheel", (e) => {
  e.preventDefault();
  // Anchor the zoom to the cursor: find the world point currently under
  // it, apply a smooth continuous scale change, then re-anchor translate
  // so that same world point stays under the cursor afterward.
  const p = toSvgPoint(e.clientX, e.clientY);
  const worldX = (p.x - tx) / scale;
  const worldY = (p.y - ty) / scale;
  const zoomFactor = Math.exp(-e.deltaY * 0.0015);
  const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * zoomFactor));
  tx = p.x - worldX * newScale;
  ty = p.y - worldY * newScale;
  scale = newScale;
  interactionBoost = 1;
  render();
}, { passive: false });
let touchStartDist = null, touchStartScale = 1, touchAnchor = null;
stage.addEventListener("touchstart", (e) => {
  if (e.touches.length === 2) {
    const [a, b] = e.touches;
    touchStartDist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    touchStartScale = scale;
    // Anchor pinch-zoom to the midpoint between the two fingers, same
    // principle as the cursor anchor above.
    const midClientX = (a.clientX + b.clientX) / 2;
    const midClientY = (a.clientY + b.clientY) / 2;
    const p = toSvgPoint(midClientX, midClientY);
    touchAnchor = { x: p.x, y: p.y, worldX: (p.x - tx) / scale, worldY: (p.y - ty) / scale };
  } else if (e.touches.length === 1) {
    dragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
  }
});
stage.addEventListener("touchmove", (e) => {
  e.preventDefault();
  if (e.touches.length === 2 && touchStartDist && touchAnchor) {
    const [a, b] = e.touches;
    const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, touchStartScale * (dist / touchStartDist)));
    tx = touchAnchor.x - touchAnchor.worldX * newScale;
    ty = touchAnchor.y - touchAnchor.worldY * newScale;
    scale = newScale;
    interactionBoost = 1;
    render();
  } else if (e.touches.length === 1 && dragging) {
    tx += e.touches[0].clientX - lastX; ty += e.touches[0].clientY - lastY;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    interactionBoost = 1;
    render();
  }
}, { passive: false });
window.addEventListener("touchend", () => { dragging = false; touchStartDist = null; touchAnchor = null; });
document.getElementById("reset-btn").onclick = () => { tx = 0; ty = 0; scale = MIN_SCALE; interactionBoost = 1; render(); };

// Manual +/- zoom, anchored to the center of the visible area using the
// same anchor-preserving math as scroll/pinch zoom, just with a fixed
// point instead of the cursor or finger midpoint.
function stepZoom(factor) {
  const rect = stage.getBoundingClientRect();
  const p = toSvgPoint(rect.left + rect.width / 2, rect.top + rect.height / 2);
  const worldX = (p.x - tx) / scale;
  const worldY = (p.y - ty) / scale;
  const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * factor));
  tx = p.x - worldX * newScale;
  ty = p.y - worldY * newScale;
  scale = newScale;
  interactionBoost = 1;
  render();
}
document.getElementById("zoom-in-btn").onclick = () => stepZoom(1.3);
document.getElementById("zoom-out-btn").onclick = () => stepZoom(1 / 1.3);

// --- movie draft ---
let draftGenres = new Set();
let draftRuntimes = new Set();
let draftStreams = new Set(); // 'DVD' or streaming service names
let draftPicks = [];
let draftProviderMatches = {}; // movie id -> array of matched service labels
let draftChosenIndex = null;
let lastDraftIds = null;
let activePicker = null; // null | 'genre' | 'runtime' | 'stream' — which blank's chips are showing
let draftLoading = false;
let draftNoStreamingMatch = false; // true if a streaming search came back empty

const RUNTIME_BUCKETS = ["short", "medium", "long", "epic"];
const RUNTIME_BUCKET_LABELS = { short: "Short", medium: "Medium", long: "Long", epic: "Epic" };
const RUNTIME_BUCKET_HINTS = {
  short: "100 min or less",
  medium: "101–140 min",
  long: "141–160 min",
  epic: "161 min or more",
};

// TMDB's provider_name strings don't always exactly match a friendly
// chip label ("Amazon Prime Video" vs "Prime Video"), so each chip
// checks against a small set of aliases instead of an exact match.
const STREAM_OPTIONS = ["DVD", "Netflix", "Hulu", "Disney+", "Max", "Prime Video", "Apple TV+", "Paramount+", "Peacock"];
const STREAM_ALIASES = {
  "Netflix": ["netflix"],
  "Hulu": ["hulu"],
  "Disney+": ["disney plus", "disney+"],
  "Max": ["max", "hbo max"],
  "Prime Video": ["prime video", "amazon prime video"],
  "Apple TV+": ["apple tv+", "apple tv plus"],
  "Paramount+": ["paramount+", "paramount plus"],
  "Peacock": ["peacock"],
};

function runtimeBucket(m) {
  const raw = getField(m, RUNTIME_FIELD_CANDIDATES);
  if (!raw) return null;
  const n = parseInt(String(raw).replace(/[^0-9]/g, ""), 10);
  if (isNaN(n)) return null;
  if (n <= 100) return "short";
  if (n <= 140) return "medium";
  if (n <= 160) return "long";
  return "epic";
}

function availableGenres() {
  return Array.from(new Set(movies.map((m) => m[curCat]).filter(Boolean))).sort();
}

// Joins a list the way you'd say it out loud: "Sci-Fi", "Sci-Fi or Fantasy",
// "Sci-Fi, Fantasy, or Action", no oxford comma before a lone pair.
function joinWithOr(list) {
  if (list.length === 0) return "";
  if (list.length === 1) return list[0];
  if (list.length === 2) return `${list[0]} or ${list[1]}`;
  return `${list.slice(0, -1).join(", ")}, or ${list[list.length - 1]}`;
}

function openDraft() {
  draftGenres = new Set();
  draftRuntimes = new Set();
  draftStreams = new Set();
  draftPicks = [];
  draftProviderMatches = {};
  draftChosenIndex = null;
  lastDraftIds = null;
  activePicker = null;
  draftLoading = false;
  draftNoStreamingMatch = false;
  renderDraft();
}

function closeDraft() {
  document.getElementById("draft-root").innerHTML = "";
}

function togglePicker(name) {
  activePicker = activePicker === name ? null : name;
  renderDraft();
}

// Selecting chips only updates state now, it doesn't trigger a draw.
// The actual draw waits for the Draft/Re-draft button, since a
// streaming check means real network calls per candidate.
function toggleDraftGenre(g) {
  if (draftGenres.has(g)) draftGenres.delete(g); else draftGenres.add(g);
  renderDraft();
}

function toggleDraftRuntime(bucket) {
  if (draftRuntimes.has(bucket)) draftRuntimes.delete(bucket); else draftRuntimes.add(bucket);
  renderDraft();
}

function toggleDraftStream(value) {
  if (value === "DVD") {
    draftStreams = draftStreams.has("DVD") ? new Set() : new Set(["DVD"]);
  } else {
    draftStreams.delete("DVD");
    if (draftStreams.has(value)) draftStreams.delete(value); else draftStreams.add(value);
  }
  renderDraft();
}

function sameIds(picks, ids) {
  const a = picks.map((m) => m.id).sort();
  return a.length === ids.length && a.every((id, i) => id === ids[i]);
}

// Checks one movie's current US streaming providers against whatever
// services are selected, returning the matched service label(s) (using
// the friendly chip names, not TMDB's raw provider strings) rather than
// just true/false, so the tile can show exactly where it was found.
// Network call per candidate, so this only runs once a real draw is
// triggered, never on every chip tap.
async function matchedStreamingServices(m) {
  try {
    const resp = await fetch(`/api/providers?title=${encodeURIComponent(getTitle(m))}`);
    const data = await resp.json();
    const names = (data.providers || []).map((n) => n.toLowerCase());
    return Array.from(draftStreams).filter((sel) =>
      (STREAM_ALIASES[sel] || []).some((alias) => names.some((n) => n.includes(alias)))
    );
  } catch {
    return [];
  }
}

// The actual draw. Genre (required) and runtime (optional) filter the
// pool locally and instantly, same as before. Streaming selection is
// the part that's genuinely async: DVD (or nothing selected) draws
// instantly from the local pool, same as always, since that's just
// "from my collection." An actual streaming service means checking
// real candidates against TMDB one at a time until 3 matches turn up
// or a reasonable number of candidates have been exhausted.
async function runDraft() {
  const selectedGenres = Array.from(draftGenres);
  const selectedRuntimes = Array.from(draftRuntimes);
  draftChosenIndex = null;
  draftNoStreamingMatch = false;
  draftProviderMatches = {};

  const pool = selectedGenres.length === 0
    ? []
    : movies.filter((m) =>
        selectedGenres.includes(m[curCat]) &&
        (selectedRuntimes.length === 0 || selectedRuntimes.includes(runtimeBucket(m)))
      );

  if (pool.length === 0) { draftPicks = []; renderDraft(); return; }

  const wantsStreaming = draftStreams.size > 0 && !draftStreams.has("DVD");

  if (!wantsStreaming) {
    let picks, attempts = 0;
    do {
      picks = [...pool].sort(() => Math.random() - 0.5).slice(0, 3);
      attempts++;
    } while (attempts < 6 && pool.length > 3 && lastDraftIds && sameIds(picks, lastDraftIds));
    lastDraftIds = picks.map((m) => m.id).sort();
    draftPicks = picks;
    renderDraft();
    return;
  }

  // Streaming path: shuffle the pool, check candidates one at a time
  // against TMDB until 3 confirmed matches are found or a reasonable
  // number of checks have been exhausted (bounds latency and API load).
  draftLoading = true;
  renderDraft();

  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  const found = [];
  const MAX_CHECKS = 15;
  for (let i = 0; i < shuffled.length && i < MAX_CHECKS && found.length < 3; i++) {
    const matches = await matchedStreamingServices(shuffled[i]);
    if (matches.length) {
      found.push(shuffled[i]);
      draftProviderMatches[shuffled[i].id] = matches;
    }
  }

  draftPicks = found;
  draftNoStreamingMatch = found.length === 0;
  lastDraftIds = found.map((m) => m.id).sort();
  draftLoading = false;
  renderDraft();
}

function selectDraftTile(i) {
  draftChosenIndex = i;
  renderDraft();
}

function watchThisMovie() {
  if (draftChosenIndex === null) return;
  const chosen = draftPicks[draftChosenIndex];
  // TODO: write today's date back to the "Last Watched" column in
  // Airtable for `chosen.id` once write access is wired up.
  closeDraft();
}

function renderDraft() {
  const genres = availableGenres();
  const selectedGenres = Array.from(draftGenres);
  const selectedRuntimes = Array.from(draftRuntimes);
  const selectedStreams = Array.from(draftStreams);

  const genreBlank = selectedGenres.length
    ? `<span class="filled blank ${activePicker === "genre" ? "active" : ""}" onclick="togglePicker('genre')">${joinWithOr(selectedGenres)}</span>`
    : `<span class="empty blank ${activePicker === "genre" ? "active" : ""}" onclick="togglePicker('genre')">a genre</span>`;

  const runtimeBlank = selectedRuntimes.length
    ? `<span class="filled blank ${activePicker === "runtime" ? "active" : ""}" onclick="togglePicker('runtime')">${joinWithOr(selectedRuntimes.map((b) => RUNTIME_BUCKET_LABELS[b].toLowerCase()))}</span>`
    : `<span class="empty blank ${activePicker === "runtime" ? "active" : ""}" onclick="togglePicker('runtime')">any length</span>`;

  const streamBlank = selectedStreams.length
    ? `<span class="filled blank ${activePicker === "stream" ? "active" : ""}" onclick="togglePicker('stream')">${selectedStreams.includes("DVD") ? "DVD" : joinWithOr(selectedStreams)}</span>`
    : `<span class="empty blank ${activePicker === "stream" ? "active" : ""}" onclick="togglePicker('stream')">streaming or on DVD</span>`;

  let pickerHtml = "";
  if (activePicker === "genre") {
    const chips = genres.map((g) => `
      <button class="genre-chip ${draftGenres.has(g) ? "selected" : ""}" onclick="toggleDraftGenre('${g.replace(/'/g, "\\'")}')">${g}</button>
    `).join("");
    pickerHtml = `<div class="picker-panel"><div class="picker-label">Genre</div><div class="genre-chips">${chips}</div></div>`;
  } else if (activePicker === "runtime") {
    const chips = RUNTIME_BUCKETS.map((b) => `
      <button class="genre-chip ${draftRuntimes.has(b) ? "selected" : ""}" onclick="toggleDraftRuntime('${b}')">${RUNTIME_BUCKET_LABELS[b]} <span style="opacity:0.6;">(${RUNTIME_BUCKET_HINTS[b]})</span></button>
    `).join("");
    pickerHtml = `<div class="picker-panel"><div class="picker-label">Runtime</div><div class="genre-chips">${chips}</div></div>`;
  } else if (activePicker === "stream") {
    const chips = STREAM_OPTIONS.map((s) => `
      <button class="genre-chip ${draftStreams.has(s) ? "selected" : ""}" onclick="toggleDraftStream('${s}')">${s === "DVD" ? "DVD (my collection)" : s}</button>
    `).join("");
    pickerHtml = `<div class="picker-panel"><div class="picker-label">Where to watch</div><div class="genre-chips">${chips}</div><p style="font-size:11px;color:#565b66;margin:10px 0 0;">Streaming data via JustWatch, through TMDB.</p></div>`;
  }

  const tilesHtml = draftPicks.map((m, i) => {
    const description = getField(m, DESCRIPTION_FIELD_CANDIDATES);
    const short = description && description.length > 110
      ? description.slice(0, 110).trim() + "…"
      : description;
    const rows = [[curCat, m[curCat]]];
    const runtime = getField(m, RUNTIME_FIELD_CANDIDATES);
    if (runtime) rows.push(["Runtime", `${String(runtime).trim()} min`]);
    const audience = categoryFields.find((f) => f.toLowerCase() === "audience");
    if (audience && m[audience]) rows.push([audience, m[audience]]);
    if (draftProviderMatches[m.id]) rows.push(["Streaming on", joinWithOr(draftProviderMatches[m.id])]);
    return `
      <div class="draft-tile ${draftChosenIndex === i ? "selected" : ""}" onclick="selectDraftTile(${i})">
        <h3>${getTitle(m)}</h3>
        ${rows.map(([label, value]) => `
          <div class="field">
            <div class="field-label">${label}</div>
            <div class="field-value">${value}</div>
          </div>`).join("")}
        ${short ? `<div class="field"><div class="field-value">${short}</div></div>` : ""}
      </div>`;
  }).join("");

  let hintHtml = "";
  if (draftLoading) {
    hintHtml = `<div class="draft-loader"><div class="draft-loader-dots"><span></span><span></span><span></span></div>Checking what's actually streaming there right now…</div>`;
  } else if (draftNoStreamingMatch) {
    hintHtml = `<p class="draft-hint">None of these are currently streaming there — try DVD or a different service.</p>`;
  } else if (selectedGenres.length && draftPicks.length === 0) {
    hintHtml = `<p class="draft-hint">No movies match that combination yet.</p>`;
  }

  const drawBtnLabel = draftPicks.length || draftLoading ? "Re-draft" : "Draft";

  document.getElementById("draft-root").innerHTML = `
    <div id="draft-overlay" onclick="if(event.target.id==='draft-overlay') closeDraft()">
      <div id="draft-card">
        <button id="draft-close" onclick="closeDraft()">&times;</button>
        <p id="draft-sentence">I want to watch a ${genreBlank} movie that is ${runtimeBlank} on ${streamBlank}.</p>
        ${pickerHtml}
        ${hintHtml}
        ${!draftLoading && draftPicks.length ? `<div class="draft-tiles">${tilesHtml}</div>` : ""}
        <div class="draft-actions">
          <button id="redraft-btn" onclick="runDraft()" ${selectedGenres.length && !draftLoading ? "" : "disabled"}>${drawBtnLabel}</button>
          <button id="watch-btn" onclick="watchThisMovie()" ${draftChosenIndex === null ? "disabled" : ""}>Let's watch this!</button>
        </div>
      </div>
    </div>`;
}

document.getElementById("draft-btn").onclick = openDraft;

// --- load real data ---
fetch("/api/movies")
  .then((r) => r.json())
  .then((data) => {
    if (data.error) throw new Error(data.error);
    movies = data.movies;
    document.getElementById("status").style.display = "none";
    categoryFields = detectCategoryFields(movies);
    // Always cluster by genre, no switching.
    curCat = GENRE_FIELD_CANDIDATES.find((f) => categoryFields.includes(f)) || categoryFields[0];
    layout();
    buildDom();
    ready = true;
  })
  .catch((err) => {
    document.getElementById("status").textContent = "Couldn't load collection: " + err.message;
  });
</script>
</body>
</html>
